name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pre-merge-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check-docs.outputs.docs_only }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for docs-only changes
        id: check-docs
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request (event: ${{ github.event_name }}), running full CI"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin ${{ github.base_ref }}

          CHANGES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || git diff --name-only "FETCH_HEAD...HEAD")

          if [ -z "$CHANGES" ]; then
            echo "No changed files detected, running full CI"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files in PR:"
          echo "$CHANGES"

          NON_DOCS=$(echo "$CHANGES" | grep -v '^[[:space:]]*$' | grep -v '^docs/' | grep -v '\.md$' || true)

          if [ -z "$NON_DOCS" ]; then
            echo "All changes are in docs/** or **/*.md -> docs-only PR"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-doc changes detected:"
            echo "$NON_DOCS"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docs-only skip notice
        if: steps.check-docs.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "### 📄 Docs-only PR detected" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipping build, lint, and test steps. Required check satisfied." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        if: steps.check-docs.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java (for Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npx tsc --noEmit
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npm run lint
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npx vitest run
        if: steps.check-docs.outputs.docs_only != 'true'
      - name: P14 incremental backup and RecordBackup proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_BACKUP: 'true'
        run: |
          rm -f /tmp/p14-cloud-backup-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_BACKUP=true npx vitest run src/firebase/__tests__/cloudBackup.spec.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=/tmp/p14-cloud-backup-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p14-cloud-backup-proof.json ]; then
            node -e 'const r = require("/tmp/p14-cloud-backup-proof.json"); const counts = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numPendingTests]; console.log(`P14 cloud backup proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}`); if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0) process.exit(1);'
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P14 backup proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"
      - run: npx firebase emulators:exec --project demo-easyorder --only firestore "npx vitest run src/firebase/__tests__/firestoreRules.spec.ts"
        if: steps.check-docs.outputs.docs_only != 'true'
      - name: P01 cloud Rules proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_RULES_PROOF: 'true'
        run: |
          rm -f /tmp/cloud-rules-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "npx vitest run src/firebase/__tests__/cloudRulesProof.spec.ts --reporter=default --reporter=json --outputFile=/tmp/cloud-rules-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/cloud-rules-proof.json ]; then
            node -e 'const r = require("/tmp/cloud-rules-proof.json"); const counts = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numPendingTests]; console.log(`Cloud Rules proof counts: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}`); if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] < 1 || counts[2] !== 0 || counts[3] !== 0) process.exit(1);'
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P05 cloud command Rules proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_COMMANDS: 'true'
        run: |
          rm -f /tmp/cloud-commands-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_COMMANDS=true npx vitest run src/firebase/__tests__/cloudCommands.spec.ts src/firebase/__tests__/cloudCommandRepository.failure.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/cloud-commands-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/cloud-commands-proof.json ]; then
            node -e 'const r = require("/tmp/cloud-commands-proof.json"); const counts = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numPendingTests]; console.log(`P05 cloud command counts: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}`); if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] < 1 || counts[2] !== 0 || counts[3] !== 0) process.exit(1);'
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P05 command proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P06 student command and complete-list proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_COMMANDS: 'true'
          EASYORDER_REQUIRE_CLOUD_STUDENTS: 'true'
        run: |
          rm -f /tmp/p06-students-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_COMMANDS=true EASYORDER_REQUIRE_CLOUD_STUDENTS=true npx vitest run src/firebase/__tests__/cloudCommands.spec.ts src/firebase/__tests__/cloudStudentRepository.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p06-students-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p06-students-proof.json ]; then
            node -e 'const r = require("/tmp/p06-students-proof.json"); const counts = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numPendingTests]; const results = r.testResults || []; const files = results.map(t => t.name || ""); const requiredFiles = ["cloudCommands.spec.ts", "cloudStudentRepository.spec.ts"]; const hasFiles = requiredFiles.every(file => files.some(name => name.endsWith(file))); const commandFile = results.find(t => (t.name || "").endsWith("cloudCommands.spec.ts")); const listFile = results.find(t => (t.name || "").endsWith("cloudStudentRepository.spec.ts")); const commandCases = commandFile?.assertionResults || []; const listCases = listFile?.assertionResults || []; const p06Cases = commandCases.filter(t => /P06\./.test(t.fullName || t.title || "")); const p07Cases = commandCases.filter(t => /P07\./.test(t.fullName || t.title || "")); const p06Kinds = ["P06.3:", "P06.5:", "P06.12:"].map(prefix => p06Cases.some(t => (t.fullName || t.title || "").includes(prefix) && t.status === "passed")); const listCount = listCases.filter(t => /P06/.test(t.fullName || t.title || "")).length; console.log(`P06/P07 command proof counts: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, files=${files.length}, P06=${p06Cases.length}, P07=${p07Cases.length}, studentList=${listCount}`); if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] < 1 || counts[2] !== 0 || counts[3] !== 0 || !hasFiles || p06Cases.length < 1 || p07Cases.length < 1 || listCount < 1 || !p06Kinds.every(Boolean) || p06Cases.some(t => t.status !== "passed") || p07Cases.some(t => t.status !== "passed")) process.exit(1);'
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P06 student proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P07 server-only day/vendor read proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_DAY_VENDORS: 'true'
        run: |
          rm -f /tmp/p07-day-vendor-read-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_DAY_VENDORS=true npx vitest run src/firebase/__tests__/cloudDayVendorRepository.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p07-day-vendor-read-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p07-day-vendor-read-proof.json ]; then
            node <<'NODE'
          const report = require('/tmp/p07-day-vendor-read-proof.json');
          const counts = [report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests];
          const files = (report.testResults || []).map(result => result.name || '');
          const readFilePresent = files.some(name => name.endsWith('cloudDayVendorRepository.spec.ts'));
          console.log(`P07 day/vendor read proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, files=${files.length}, requiredReadFile=${readFilePresent}`);
          if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0 || !readFilePresent) process.exit(1);
          NODE
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P07 server-read proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P08 cloud order reads, retries and transactions list proof (demo-only Firestore Emulator)
