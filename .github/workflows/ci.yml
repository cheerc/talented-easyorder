        env:
          EASYORDER_REQUIRE_CLOUD_ORDERS: 'true'
        run: |
          rm -f /tmp/p08-cloud-orders-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_ORDERS=true npx vitest run src/firebase/__tests__/cloudOrderRepository.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p08-cloud-orders-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p08-cloud-orders-proof.json ]; then
            node <<'NODE'
          const report = require('/tmp/p08-cloud-orders-proof.json');
          const counts = [report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests];
          const files = (report.testResults || []).map(result => result.name || '');
          const orderFilePresent = files.some(name => name.endsWith('cloudOrderRepository.spec.ts'));
          console.log(`P08 cloud order proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, requiredFile=${orderFilePresent}`);
          if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0 || !orderFilePresent) process.exit(1);
          NODE
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P08 cloud order proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P09a cloud payments and counter cash movement proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_CASH: 'true'
        run: |
          rm -f /tmp/p09a-cloud-cash-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_CASH=true npx vitest run src/firebase/__tests__/cloudCashMovement.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p09a-cloud-cash-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p09a-cloud-cash-proof.json ]; then
            node <<'NODE'
          const report = require('/tmp/p09a-cloud-cash-proof.json');
          const counts = [report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests];
          const files = (report.testResults || []).map(result => result.name || '');
          const cashFilePresent = files.some(name => name.endsWith('cloudCashMovement.spec.ts'));
          console.log(`P09a cloud cash proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, requiredFile=${cashFilePresent}`);
          if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0 || !cashFilePresent) process.exit(1);
          NODE
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P09a cloud cash proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P09b account refund proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_REFUND: 'true'
        run: |
          rm -f /tmp/p09b-cloud-refund-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_REFUND=true npx vitest run src/firebase/__tests__/cloudRefund.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p09b-cloud-refund-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p09b-cloud-refund-proof.json ]; then
            node <<'NODE'
          const report = require('/tmp/p09b-cloud-refund-proof.json');
          const counts = [report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests];
          const files = (report.testResults || []).map(result => result.name || '');
          const refundFilePresent = files.some(name => name.endsWith('cloudRefund.spec.ts'));
          console.log(`P09b cloud refund proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, requiredFile=${refundFilePresent}`);
          if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0 || !refundFilePresent) process.exit(1);
          NODE
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P09b cloud refund proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"
      - name: P10a transaction mutation proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_MUTATIONS: 'true'
        run: |
          rm -f /tmp/p10a-cloud-mutation-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_MUTATIONS=true npx vitest run src/firebase/__tests__/cloudTransactionMutation.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p10a-cloud-mutation-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p10a-cloud-mutation-proof.json ]; then
            node <<'NODE'
          const report = require('/tmp/p10a-cloud-mutation-proof.json');
          const counts = [report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests];
          const files = (report.testResults || []).map(result => result.name || '');
          const mutationFilePresent = files.some(name => name.endsWith('cloudTransactionMutation.spec.ts'));
          console.log(`P10a cloud mutation proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, requiredFile=${mutationFilePresent}`);
          if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0 || !mutationFilePresent) process.exit(1);
          NODE
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P10a cloud mutation proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"
      - name: P10b opening correction proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_OPENING: 'true'
        run: |
          rm -f /tmp/p10b-cloud-opening-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "EASYORDER_REQUIRE_CLOUD_OPENING=true npx vitest run src/firebase/__tests__/cloudOpeningCorrection.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/p10b-cloud-opening-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/p10b-cloud-opening-proof.json ]; then
            node <<'NODE'
          const report = require('/tmp/p10b-cloud-opening-proof.json');
          const counts = [report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests];
          const files = (report.testResults || []).map(result => result.name || '');
          const openingFilePresent = files.some(name => name.endsWith('cloudOpeningCorrection.spec.ts'));
          console.log(`P10b cloud opening proof: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}, requiredFile=${openingFilePresent}`);
          if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] !== counts[0] || counts[2] !== 0 || counts[3] !== 0 || !openingFilePresent) process.exit(1);
          NODE
            count_check_status=$?
          else
