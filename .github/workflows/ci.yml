name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pre-merge-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check-docs.outputs.docs_only }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for docs-only changes
        id: check-docs
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request (event: ${{ github.event_name }}), running full CI"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin ${{ github.base_ref }}

          CHANGES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || git diff --name-only "FETCH_HEAD...HEAD")

          if [ -z "$CHANGES" ]; then
            echo "No changed files detected, running full CI"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files in PR:"
          echo "$CHANGES"

          NON_DOCS=$(echo "$CHANGES" | grep -v '^[[:space:]]*$' | grep -v '^docs/' | grep -v '\.md$' || true)

          if [ -z "$NON_DOCS" ]; then
            echo "All changes are in docs/** or **/*.md -> docs-only PR"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-doc changes detected:"
            echo "$NON_DOCS"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docs-only skip notice
        if: steps.check-docs.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "### 📄 Docs-only PR detected" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipping build, lint, and test steps. Required check satisfied." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        if: steps.check-docs.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java (for Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npx tsc --noEmit
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npm run lint
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npx vitest run
        if: steps.check-docs.outputs.docs_only != 'true'
      - run: npx firebase emulators:exec --project demo-easyorder --only firestore "npx vitest run src/firebase/__tests__/firestoreRules.spec.ts"
        if: steps.check-docs.outputs.docs_only != 'true'
      - name: P01 cloud Rules proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_CLOUD_RULES_PROOF: 'true'
        run: |
          rm -f /tmp/cloud-rules-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "npx vitest run src/firebase/__tests__/cloudRulesProof.spec.ts --reporter=default --reporter=json --outputFile=/tmp/cloud-rules-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/cloud-rules-proof.json ]; then
            node -e 'const r = require("/tmp/cloud-rules-proof.json"); const counts = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numPendingTests]; console.log(`Cloud Rules proof counts: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}`); if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] < 1 || counts[2] !== 0 || counts[3] !== 0) process.exit(1);'
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: P04 active lease Rules proof (demo-only Firestore Emulator)
        if: steps.check-docs.outputs.docs_only != 'true'
        env:
          EASYORDER_REQUIRE_ACTIVE_ACCOUNT_LEASE_PROOF: 'true'
        run: |
          rm -f /tmp/active-account-lease-proof.json
          set +e
          npx firebase emulators:exec --project demo-easyorder --only firestore "npx vitest run src/firebase/__tests__/activeAccountLease.spec.ts --reporter=default --reporter=json --outputFile=/tmp/active-account-lease-proof.json"
          emulator_test_status=$?
          if [ -f /tmp/active-account-lease-proof.json ]; then
            node -e 'const r = require("/tmp/active-account-lease-proof.json"); const counts = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numPendingTests]; console.log(`P04 active lease counts: total=${counts[0]}, passed=${counts[1]}, failed=${counts[2]}, skipped=${counts[3]}`); if (!counts.every(Number.isInteger) || counts[0] < 1 || counts[1] < 1 || counts[2] !== 0 || counts[3] !== 0) process.exit(1);'
            count_check_status=$?
          else
            echo 'Vitest JSON report is missing; P04 lease proof execution cannot be confirmed.'
            count_check_status=1
          fi
          set -e
          if [ "$emulator_test_status" -ne 0 ]; then exit "$emulator_test_status"; fi
          exit "$count_check_status"

      - name: 📊 PR Diff Stats
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --json additions,deletions,changedFiles \
            --jq '"| Metric | Value |\n|--------|-------|\n| ➕ Additions | \(.additions) |\n| ➖ Deletions | \(.deletions) |\n| 📁 Changed Files | \(.changedFiles) |"' \
            >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: build-and-test
    if: needs.build-and-test.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_FIREBASE_API_KEY: "dummy-api-key"
      VITE_FIREBASE_AUTH_DOMAIN: "dummy-auth-domain"
      VITE_FIREBASE_PROJECT_ID: "dummy-project-id"
      VITE_FIREBASE_APP_ID: "dummy-app-id"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_STORAGE_BUCKET: "dummy-bucket"
      VITE_FIREBASE_USE_EMULATOR: "true"
      VITE_FIRESTORE_EMULATOR_HOST: "127.0.0.1"
      VITE_FIRESTORE_EMULATOR_PORT: "8080"
      VITE_FIREBASE_AUTH_EMULATOR_URL: "http://127.0.0.1:9099"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java (for Firebase emulators)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: E2E Tests
        run: npx firebase emulators:exec --project demo-easyorder --only auth,firestore "npx playwright test && npx playwright test --config playwright.prototype.config.ts"

      - name: Upload Playwright Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
