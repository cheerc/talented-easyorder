# 手動部署到 Firebase（indexes → 等 READY → rules → hosting）。
# 只能由有寫入權限的人從 main 手動觸發，並經 GitHub Environment 的 required reviewer 核准後才拿得到 Google 授權。
# 不存任何金鑰：Google 端以 Workload Identity Federation 只信任本 repo 指定 environment 的 OIDC token。
# 設定步驟見 docs/ops/DEPLOYMENT-GUIDE.md「GitHub Actions 部署」。firebase-test：agent 告知使用者後可自行觸發並核准；firebase-production：agent 只能在使用者於當次對話明確要求時觸發，並在使用者對該次 run 明確允許後才核准（見根目錄 CLAUDE.md）。
name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: 部署目標（GitHub Environment）
        required: true
        type: choice
        options:
          - firebase-test
          - firebase-production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  ci-green:
    name: Require green Frontend CI on this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Require a successful Frontend CI push run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success" --jq '.total_count')"
          if [ "${count}" -lt 1 ]; then
            echo "::error::main 上 ${GITHUB_SHA} 沒有成功的 Frontend CI push run；等 CI 通過後再部署。"
            exit 1
          fi
          echo "Frontend CI success on ${GITHUB_SHA}"

  deploy:
    name: Deploy ${{ inputs.target }}
    needs: ci-green
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      EASYORDER_DEPLOY_PROJECT: ${{ vars.EASYORDER_DEPLOY_PROJECT }}
      EASYORDER_REGION: ${{ vars.EASYORDER_REGION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 本 job 有 id-token 權限；不執行依賴的 install script（build 與 firebase CLI 都不需要）。
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check environment variables
        env:
          WEB_CONFIG: ${{ vars.EASYORDER_WEB_CONFIG }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          for name in EASYORDER_DEPLOY_PROJECT EASYORDER_REGION WEB_CONFIG WIF_PROVIDER SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then echo "::error::GitHub Environment 缺少變數 ${name}"; exit 1; fi
          done
          printf '%s' "${WEB_CONFIG}" > "${RUNNER_TEMP}/web-config.json"

      # 在 auth 步驟前建立 release，確保工作目錄乾淨（sourceDirty=false）、憑證檔尚未寫入。
      # 注意：id-token 權限是整個 job 的，build 期間執行的依賴程式理論上也能要 OIDC token；風險與本機部署同類。
      - name: Prepare release
        run: |
          ./deploy.sh prepare --project "${EASYORDER_DEPLOY_PROJECT}" --web-config "${RUNNER_TEMP}/web-config.json" \
            --region "${EASYORDER_REGION}" --out "${RUNNER_TEMP}/release"
          ./deploy.sh check --release "${RUNNER_TEMP}/release"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Deploy indexes, wait READY, rules, hosting
        run: ./deploy.sh deploy-ci --project "${EASYORDER_DEPLOY_PROJECT}" --release "${RUNNER_TEMP}/release"
